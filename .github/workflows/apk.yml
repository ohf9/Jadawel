name: Build APK
on:
  push:
    branches: [main]
    paths: ['docs/**', 'capacitor.config.json', 'package.json', '.github/workflows/apk.yml', 'android-patch/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Android customisation
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # كل مرة تفتح فيها التطبيق تظهر نافذة مستقلة (DeX / تعدد النوافذ)، وتبقى النافذتان تعملان معًا
          sed -i 's#android:launchMode="singleTask"#android:launchMode="standard" android:documentLaunchMode="always"#' "$M"
          sed -i 's#<application#<application#; s#</application>#<meta-data android:name="android.allow_multiple_resumed_activities" android:value="true" /></application>#' "$M"
          # allow tablets of any orientation and DeX multi-window resizing
          sed -i 's#<activity#<activity android:resizeableActivity="true" android:screenOrientation="unspecified"#' "$M"
          sed -i 's#android:configChanges="[^"]*"#android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode|navigation|density|locale|layoutDirection"#' "$M"
          cp android-patch/*.java android/app/src/main/java/com/jadawel/app/
          # أيقونة التطبيق (جدول بيانات)
          cp -r android-patch/res/. android/app/src/main/res/
          # فتح ملفات Excel وCSV من مدير الملفات ومن "مشاركة"
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          mimes=['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-excel','application/vnd.ms-excel.sheet.macroEnabled.12','application/x-excel','application/excel','application/x-msexcel','text/csv','text/comma-separated-values','application/csv','text/tab-separated-values','application/vnd.oasis.opendocument.spreadsheet']
          data=''.join('<data android:mimeType="%s" />' % m for m in mimes)
          f=('<intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" />'+data+'</intent-filter>'
             '<intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" />'+data+'</intent-filter>'
             '<intent-filter><action android:name="android.intent.action.SEND_MULTIPLE" /><category android:name="android.intent.category.DEFAULT" />'+data+'</intent-filter>')
          s=s.replace('</activity>', f+'</activity>',1)
          open(p,'w').write(s)
          PY
      - name: Stable signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp android-patch/debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk jadawel.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jadawel.apk --title "جداول (APK)" --notes "نزّل jadawel.apk وثبّته على التابلت" --latest
