<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e6b41">
<title>جداول</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="toolbar" role="toolbar">
  <span class="brand">جداول</span>
  <div class="grp">
    <button id="btn-new" title="مصنف جديد (Ctrl+Alt+N)">＋ جديد</button>
    <button id="btn-open" title="فتح ملف أو أكثر (Ctrl+O)">📂 فتح</button>
    <button id="btn-save" title="حفظ (Ctrl+S)">💾 حفظ</button>
    <button id="btn-saveas" title="حفظ نسخة باسم آخر (F12)">حفظ باسم</button>
  </div>
  <div class="grp">
    <button id="btn-undo" title="تراجع (Ctrl+Z)">↶ تراجع</button>
    <button id="btn-redo" title="إعادة (Ctrl+Y)">↷ إعادة</button>
  </div>
  <div class="grp">
    <button id="btn-cut" title="قص (Ctrl+X)">✂ قص</button>
    <button id="btn-copy" title="نسخ (Ctrl+C)">⧉ نسخ</button>
    <button id="btn-paste" title="لصق (Ctrl+V)">📋 لصق</button>
  </div>
  <div class="grp seg" aria-label="طريقة العرض">
    <button data-layout-btn="single" class="on" title="ملف واحد">▭ ملف واحد</button>
    <button data-layout-btn="h" title="ملفان جنبًا إلى جنب">◫ جنبًا إلى جنب</button>
    <button data-layout-btn="v" title="ملفان فوق بعض (مناسب للوضع العمودي)">⬒ فوق بعض</button>
    <button id="btn-second" title="اعرض الملف الحالي في اللوحة الأخرى للتحكم بورقتين منه معًا">⧉ ورقتان من نفس الملف</button>
  </div>
</header>
<nav id="tabs" class="tabs" aria-label="الملفات المفتوحة"></nav>
<main id="workspace" data-layout="single"></main>
<div id="hint" class="hint" hidden>
  <h1>جداول</h1>
  <p>افتح ملفين أو أكثر (XLSX أو CSV) لعرضهما جنبًا إلى جنب، أو أنشئ مصنفًا جديدًا.</p>
  <p class="small">يمكنك أيضًا سحب الملفات وإفلاتها هنا. تُحفظ تعديلاتك تلقائيًا على هذا الجهاز لاستعادتها بعد الإغلاق.</p>
</div>
<footer class="statusbar"><span id="autosave"></span><span id="status"></span></footer>
<input type="file" id="file-input" multiple accept=".xlsx,.xlsm,.csv,.tsv,.txt,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>
<dialog id="dialog"><h2></h2><div class="body"></div><input type="text" dir="auto"><div class="btns"></div></dialog>
<div id="toasts"></div>
<script src="vendor/exceljs.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
